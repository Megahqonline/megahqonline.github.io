#mobileStage {
  width: 100%;
  min-width: 100%;

*/

  width: 100%;

  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex: 0 0 auto;

#leitor canvas {
  display: block;

<script type="module">

import * as pdfjsLib from

"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/* =========================

========================= */

const leitor =

document.getElementById("areaLeitor");

const telaCarregamento =
document.getElementById("telaCarregamento");

const carregamentoMensagem =
document.getElementById("carregamentoMensagem");

const carregamentoBarra =
document.getElementById("carregamentoBarra");

document.getElementById("carregamentoPorcentagem");


/* =========================
   CONFIGURAÇÕES
========================= */

const zoomMinimo = 0.2;

const zoomMaximo = 3.0;

const passoZoom = 0.10;

let zoom = 0.5;

let pdfAtual = null;

let urlPDFAtual = "";

let totalPaginas = 0;
let paginasRenderizadas = 0;
let paginasEmRenderizacao = new Set();
let observadorPaginas = null;
let nomeArquivoAtual = "";


/* =========================
   URL DO WORKER
========================= */

const workerURL =
"https://polished-term-e56bmega-leitor-proxy.megahqwix.workers.dev/?id=";


/* =========================
   OBTÉM O PDF PELA URL
========================= */

function obterPDF() {

  const parametros =
  new URLSearchParams(window.location.search);

  const id =
  parametros.get("id");

  const resourcekey =
  parametros.get("resourcekey");

  const pdf =
  parametros.get("pdf");

  /*
    ?id=...
    Google Drive através do Worker
  */

  if (id) {

    return {
      url:
        workerURL +
        encodeURIComponent(id) +
        (resourcekey
          ? "&resourcekey=" + encodeURIComponent(resourcekey)
          : ""),

      download:
        workerURL +
        encodeURIComponent(id) +
        (resourcekey
          ? "&resourcekey=" + encodeURIComponent(resourcekey)
          : ""),

      tipo:
        "worker"
    };

  }


  /*
    ?pdf=...
    PDF armazenado diretamente no GitHub
  */

  if (pdf) {

    return {
      url:
        pdf,

      download:
        pdf,

      tipo:
        "local"
    };

  }


  /*
    Caso não exista parâmetro,
    abre o PDF padrão.
  */

  return {

    url:
      "UBS CIDADE LUZ PREVIAS.pdf",

    download:
      "UBS CIDADE LUZ PREVIAS.pdf",

    tipo:
      "local"
  };

}


/* =========================
   CARREGAMENTO / TÍTULO
========================= */
function atualizarProgresso(valor, mensagem) {
  valor = Math.max(0, Math.min(100, Math.round(valor)));
  carregamentoBarra.style.width = valor + "%";
  carregamentoPorcentagem.textContent = valor + "%";
  if (mensagem) carregamentoMensagem.textContent = mensagem;
}

function ocultarCarregamento() {
  telaCarregamento.classList.add("oculta");
}

function nomeDoPDFLocal(url) {
  try {
    return decodeURIComponent(url.split("/").pop().split("?")[0]);
  } catch (e) {
    return "";
  }
}

async function obterNomeArquivoWorker(dados) {
  if (!dados || dados.tipo !== "worker") return "";

  try {
    const separador = dados.url.includes("?") ? "&" : "?";
    const resposta = await fetch(
      dados.url + separador + "metadata=1",
      { method: "GET", cache: "no-store" }
    );

    if (!resposta.ok) return "";

    const dadosNome = await resposta.json();
    const nome = dadosNome && dadosNome.name ? String(dadosNome.name).trim() : "";

    if (nome) {
      aplicarTitulo(nome);
      return nome;
    }
  } catch (e) {
    console.debug("Não foi possível obter o nome do arquivo no Worker.", e);
  }

  return "";
}

function definirTamanhoDosPlaceholders(viewport) {
  if (!viewport) return;

  const largura = Math.max(1, Number(viewport.width) || 612);
  const altura = Math.max(1, Number(viewport.height) || 792);

  leitor.style.setProperty("--pagina-placeholder-width", largura + "px");
  leitor.style.setProperty("--pagina-placeholder-height", altura + "px");

  const larguraMobile = Math.max(1, window.innerWidth - 20);
  const alturaMobile = larguraMobile * (altura / largura);

  leitor.style.setProperty("--pagina-placeholder-width-mobile", larguraMobile + "px");
  leitor.style.setProperty("--pagina-placeholder-height-mobile", alturaMobile + "px");
}

function aplicarTitulo(nome) {
  if (!nome) return;
  nome = String(nome).trim();
  if (!nome) return;
  nomeArquivoAtual = nome;
  document.title = nome;
}

async function tentarTituloDosMetadados() {
  try {
    const metadata = await pdfAtual.getMetadata();
    const info = metadata && metadata.info ? metadata.info : {};
    const xmp = metadata && metadata.metadata ? metadata.metadata : null;

    let titulo = info.Title ? String(info.Title).trim() : "";

    if (!titulo && xmp) {
      try {
        titulo = String(xmp.get("dc:title") || "").trim();
      } catch (e) {}
    }

    if (titulo) aplicarTitulo(titulo);
  } catch (e) {
    console.debug("Metadados do PDF sem título utilizável.");
  }
}

/* =========================
   CARREGAR PDF — V3
========================= */
async function carregarPDF() {

  const dados = obterPDF();
  urlPDFAtual = dados.url;
  leitor.innerHTML = "";
  paginasRenderizadas = 0;
  totalPaginas = 0;
  paginasEmRenderizacao = new Set();

  if (observadorPaginas) {
    observadorPaginas.disconnect();
    observadorPaginas = null;
  }

  telaCarregamento.classList.remove("oculta");
  atualizarProgresso(0, "Preparando a primeira página para leitura.");

  /* Para PDF local, o nome já está disponível na própria URL. */
  if (dados.tipo === "local") {
    aplicarTitulo(nomeDoPDFLocal(dados.url));
  } else {
    /*
      Não fazemos HEAD/Range extra aqui.
      Essas requisições duplicavam o tráfego e podiam deixar
      o carregamento mais lento. O título será obtido dos
      metadados do próprio PDF quando disponíveis.
    */
    document.title = "MegaHQ Online";
  }

  try {

    const nomeArquivoPromise =
      dados.tipo === "worker"
        ? obterNomeArquivoWorker(dados)
        : Promise.resolve("");

    const loadingTask = pdfjsLib.getDocument({
      url: dados.url,
      withCredentials: false,
      disableAutoFetch: false,
      disableStream: false,
      rangeChunkSize: 262144
    });

    /*
      IMPORTANTE: nunca mostramos 100% durante o download.
      100% só aparece depois que a primeira página está na tela.
    */
    loadingTask.onProgress = function(progresso) {
      if (progresso && progresso.total > 0) {
        const percentual = Math.min(
          90,
          Math.round((progresso.loaded / progresso.total) * 90)
        );
        atualizarProgresso(percentual, "Carregando o arquivo...");
      } else {
        atualizarProgresso(15, "Carregando o arquivo...");
      }
    };

    const resultados = await Promise.all([
      loadingTask.promise,
      nomeArquivoPromise
    ]);

    pdfAtual = resultados[0];
    totalPaginas = pdfAtual.numPages;

    /* Só usa o título interno se o Worker não forneceu o nome real. */
    if (!nomeArquivoAtual) {
      await tentarTituloDosMetadados();
    }

    atualizarProgresso(93, "Preparando a primeira página...");

    /*
      A primeira página é prioridade absoluta.
      Não esperamos nenhuma outra página antes de liberar a leitura.
    */
    const paginaModelo = await pdfAtual.getPage(1);
    const viewportModelo = paginaModelo.getViewport({ scale: 1 });
    definirTamanhoDosPlaceholders(viewportModelo);

    const primeiraLinha = document.createElement("div");
    primeiraLinha.className = "paginaLinha";
    primeiraLinha.dataset.page = "1";

    const primeiraPagina = document.createElement("div");
    primeiraPagina.className = "paginaPlaceholder";
    primeiraPagina.dataset.page = "1";

    primeiraLinha.appendChild(primeiraPagina);
    leitor.appendChild(primeiraLinha);

    await renderizarPagina(1, primeiraPagina);
    paginasRenderizadas = 1;

    /* Agora, e somente agora, 100% e leitura liberada. */
    atualizarProgresso(100, "HQ pronta para leitura.");
    atualizarZoom();
    ocultarCarregamento();

    /*
      As demais páginas são criadas como espaços reservados e
      só viram canvas quando estiverem próximas da área visível.
      Isso elimina a espera de renderizar a HQ inteira antes de ler.
    */
    criarPaginasLazy();

  } catch (erro) {

    console.error(erro);
    carregamentoMensagem.textContent = "Não foi possível carregar a HQ.";
    carregamentoPorcentagem.textContent = "";

    leitor.innerHTML = `
      <div style="color:white;padding:40px;max-width:700px;margin:auto;font-family:Arial;">
        <h2>Não foi possível carregar a HQ.</h2>
        <p>Verifique se o arquivo está disponível e se o link do Google Drive está correto.</p>
      </div>
    `;
  }
}

/* =========================
   PÁGINAS SOB DEMANDA
========================= */
function criarPaginasLazy() {

  if (totalPaginas <= 1) return;

  for (let numero = 2; numero <= totalPaginas; numero++) {
    const linha = document.createElement("div");
    linha.className = "paginaLinha";
    linha.dataset.page = String(numero);

    const placeholder = document.createElement("div");
    placeholder.className = "paginaPlaceholder";
    placeholder.dataset.page = String(numero);

    linha.appendChild(placeholder);
    leitor.appendChild(linha);
  }

  observadorPaginas = new IntersectionObserver(
    entradas => {
      for (const entrada of entradas) {
        if (!entrada.isIntersecting) continue;

        const elemento = entrada.target;
        const numero = Number(elemento.dataset.page);

        if (!numero || numero === 1) continue;

        /* Renderiza a página atual e as duas seguintes. */
        for (let n = numero; n <= Math.min(numero + 2, totalPaginas); n++) {
          const alvo = leitor.querySelector(
            `.paginaPlaceholder[data-page="${n}"]`
          );

          if (alvo) renderizarPaginaSeNecessaria(n, alvo);
        }
      }
    },
    {
      root: areaLeitor,
      rootMargin: "1200px 0px 1200px 0px",
      threshold: 0
    }
  );

  const placeholders = leitor.querySelectorAll(".paginaPlaceholder");
  placeholders.forEach(p => observadorPaginas.observe(p));
}

async function renderizarPaginaSeNecessaria(numeroPagina, elemento) {

  if (!elemento || paginasEmRenderizacao.has(numeroPagina)) return;
  if (elemento.dataset.renderizada === "1") return;

  paginasEmRenderizacao.add(numeroPagina);

  try {
    await renderizarPagina(numeroPagina, elemento);
    paginasRenderizadas++;
    elemento.dataset.renderizada = "1";
  } catch (erro) {
    console.error("Erro ao renderizar página", numeroPagina, erro);
  } finally {
    paginasEmRenderizacao.delete(numeroPagina);
  }
}

/* =========================
   RENDERIZAR PÁGINA
========================= */
async function renderizarPagina(numeroPagina, destino) {

  const pagina = await pdfAtual.getPage(numeroPagina);
  const viewport = pagina.getViewport({ scale: 1 });

  const canvas = document.createElement("canvas");
  const contexto = canvas.getContext("2d", { alpha: false });

  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.dataset.originalWidth = viewport.width;
  canvas.dataset.originalHeight = viewport.height;

  if (destino) {
    destino.style.width = viewport.width + "px";
    destino.style.height = viewport.height + "px";
    destino.replaceWith(canvas);
  } else {
    leitor.appendChild(canvas);
  }

  canvas.style.display = "block";
  canvas.style.margin = "0 auto 12px auto";
  canvas.style.background = "white";
  canvas.style.boxShadow = "0 2px 8px rgba(0,0,0,.45)";

  await pagina.render({
    canvasContext: contexto,
    viewport: viewport
  }).promise;
}


/* =========================
   ZOOM
========================= */

function atualizarZoom() {

  zoomTexto.textContent =
    Math.round(zoom * 100) + "%";


  if (
    window.innerWidth <= 700
  ) {

    atualizarZoomMobile();

  } else {

    atualizarZoomDesktop();

  }

}


/* =========================
   ZOOM DESKTOP
========================= */

function atualizarZoomDesktop() {

  /*
    No desktop não usamos transform:scale().
    O transform mantém o tamanho de layout original do leitor,
    mesmo quando a imagem visual fica menor, criando uma área
    vertical vazia depois da última página.

    Aqui o zoom é aplicado diretamente ao tamanho visual de cada
    canvas e à sua linha. Assim, a área rolável termina exatamente
    onde termina a última página.
  */

  leitor.style.transform = "none";
  leitor.style.marginBottom = "0";
  leitor.style.height = "auto";

  const linhas = leitor.querySelectorAll(".paginaLinha");

  linhas.forEach(linha => {

    const canvas = linha.querySelector("canvas");

    if (!canvas) {
      return;
    }

    const larguraOriginal =
      Number(canvas.dataset.originalWidth || canvas.width || 0);

    const alturaOriginal =
      Number(canvas.dataset.originalHeight || canvas.height || 0);

    if (!larguraOriginal || !alturaOriginal) {
      return;
    }

    const largura = larguraOriginal * zoom;
    const altura = alturaOriginal * zoom;

    canvas.style.width = largura + "px";
    canvas.style.height = altura + "px";

    /*
      A própria linha passa a ter exatamente a altura da página
      ampliada/reduzida, mais o espaçamento entre páginas.
    */
    linha.style.height = (altura + 12) + "px";

    /*
      Cada página continua independente horizontalmente.
      Se ficar maior que a tela, sua própria linha ganha rolagem.
    */
    if (largura > areaLeitor.clientWidth + 1) {
      linha.style.overflowX = "auto";
      linha.style.justifyContent = "flex-start";

      /* Centraliza inicialmente a página larga. */
      requestAnimationFrame(() => {
        linha.scrollLeft =
          Math.max(0, (largura - linha.clientWidth) / 2);
      });
    } else {
      linha.style.overflowX = "hidden";
      linha.style.justifyContent = "center";
      linha.scrollLeft = 0;
    }

  });

  /*
    Garante que não exista uma sobra artificial depois da última
    página. O padding do mobileStage é mantido apenas como margem
    visual superior/inferior.
  */
  mobileStage.style.height = "auto";

}


/* =========================
   ZOOM MOBILE
========================= */

let escalaMobile = 1;

let toqueInicial = null;

let distanciaInicial = null;


function atualizarZoomMobile() {

  leitor.style.transform =
    `scale(${escalaMobile})`;

  /*
    Corrige a altura de layout criada pelo transform:
    a área rolável passa a terminar junto com a última página.
  */
  const alturaLayout = leitor.scrollHeight;
  leitor.style.marginBottom =
    ((escalaMobile - 1) * alturaLayout) + "px";

}


/* =========================
   BOTÕES DE ZOOM
========================= */

btnMenos.addEventListener(
  "click",
  () => {

    zoom =
      Math.max(
        zoomMinimo,
        Number(
          (zoom - passoZoom)
          .toFixed(2)
        )
      );

    atualizarZoom();

  }
);


btnMais.addEventListener(
  "click",
  () => {

    zoom =
      Math.min(
        zoomMaximo,
        Number(
          (zoom + passoZoom)
          .toFixed(2)
        )
      );

    atualizarZoom();

  }
);


btnReset.addEventListener(
  "click",
  () => {

    zoom = 1;

    if (
      window.innerWidth <= 700
    ) {

      escalaMobile = 1;

      atualizarZoom();

    } else {

      atualizarZoom();

    }

  }
);


/* =========================
   FULLSCREEN
========================= */

btnFullscreen.addEventListener(
  "click",
  async () => {

    try {

      if (
        areaLeitor.requestFullscreen
      ) {

        await areaLeitor.requestFullscreen();

      }

    } catch (erro) {

      console.error(
        "Fullscreen:",
        erro
      );

    }

  }
);


btnSairFullscreen.addEventListener(
  "click",
  async () => {

    if (
      document.fullscreenElement
    ) {

      await document.exitFullscreen();

    }

  }
);


document.addEventListener(
  "fullscreenchange",
  () => {

    const ativo =
      document.fullscreenElement ===
      areaLeitor;

    if (ativo) {

      areaLeitor.classList.add(
        "fullscreen"
      );

      btnSairFullscreen.style.display =
        "flex";

      btnSairFullscreen.style.alignItems =
        "center";

      btnSairFullscreen.style.justifyContent =
        "center";

      btnFullscreen.style.display =
        "none";

      document.body.style.overflow =
        "hidden";

    } else {

      areaLeitor.classList.remove(
        "fullscreen"
      );

      btnSairFullscreen.style.display =
        "none";

      btnFullscreen.style.display =
        "flex";

      document.body.style.overflow =
        "hidden";

    }

  }
);


/* =========================
   ESC PARA SAIR
========================= */

document.addEventListener(
  "keydown",
  (evento) => {

    if (
      evento.key === "Escape" &&
      document.fullscreenElement
    ) {

      document.exitFullscreen();

    }

  }
);

/* =========================
   PINCH ZOOM MOBILE
========================= */

function distanciaToque(
  toque1,
  toque2
) {

  const dx =
    toque1.clientX -
    toque2.clientX;

  const dy =
    toque1.clientY -
    toque2.clientY;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


areaLeitor.addEventListener(
  "touchstart",
  (evento) => {

    if (
      evento.touches.length === 2
    ) {

      distanciaInicial =
        distanciaToque(
          evento.touches[0],
          evento.touches[1]
        );

      escalaMobileAtual =
        escalaMobile;

    }

  },
  {
    passive: true
  }
);


let escalaMobileAtual = 1;


areaLeitor.addEventListener(
  "touchmove",
  (evento) => {

    if (
      evento.touches.length === 2 &&
      window.innerWidth <= 700
    ) {

      const distanciaAtual =
        distanciaToque(
          evento.touches[0],
          evento.touches[1]
        );

      if (
        distanciaInicial
      ) {

        const fator =
          distanciaAtual /
          distanciaInicial;

        escalaMobile =
          Math.min(
            4,
            Math.max(
              1,
              escalaMobileAtual *
              fator
            )
          );

        atualizarZoomMobile();

      }

      evento.preventDefault();

    }

  },
  {
    passive: false
  }
);


areaLeitor.addEventListener(
  "touchend",
  () => {

    distanciaInicial =
      null;

  },
  {
    passive: true
  }
);

        );
      }).catch(() => {});
    }

    atualizarZoom();

  }
);
